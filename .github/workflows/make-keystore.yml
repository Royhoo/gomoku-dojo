name: 生成签名密钥

# 手动触发一次，产出一个正式的签名密钥库（.jks）。
# 下载后请妥善保存：这个文件 + 口令，是以后升级 App 的唯一凭证，丢了就无法覆盖安装。
#
# 口令从仓库 Secret `KS_PASSWORD` 读取，不走工作流输入——避免明文出现在公开日志里。
# 生成一次之后，把仓库 Secret `KS_PASSWORD` 删掉即可。
on:
  workflow_dispatch:
    inputs:
      alias:
        description: "密钥别名"
        required: false
        default: gomoku
        type: string

permissions:
  contents: read

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: 准备 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 生成密钥库
        env:
          PW: ${{ secrets.KS_PASSWORD }}
          ALIAS: ${{ inputs.alias }}
        run: |
          if [ -z "$PW" ]; then
            echo "::error::未配置 Secret KS_PASSWORD，请先在仓库 Secrets 里添加口令"
            exit 1
          fi
          keytool -genkeypair -v \
            -keystore release.jks \
            -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "$ALIAS" \
            -storepass "$PW" -keypass "$PW" \
            -dname "CN=Gomoku Dojo, OU=Personal, O=Personal, L=Beijing, ST=Beijing, C=CN"

      - name: 输出指纹（上架时可能要用）
        env:
          PW: ${{ secrets.KS_PASSWORD }}
          ALIAS: ${{ inputs.alias }}
        run: |
          keytool -list -v -keystore release.jks -alias "$ALIAS" -storepass "$PW" \
            | grep -E "SHA1:|SHA-1:|MD5:" || true

      - name: 上传密钥库
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: release.jks
          if-no-files-found: error
          retention-days: 7
