name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 准备 JDK 21（Capacitor 8 的 Android 库要求 Java 21 编译）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 安装依赖
        run: npm ci

      - name: 构建 Web 产物（App 模式：相对路径 + Hash 路由）
        run: npm run build:app

      - name: 同步到安卓工程
        run: npx cap sync android

      - name: 准备正式签名（仅在配置了 Secrets 时生效）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            {
              echo "storeFile=app/release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/keystore.properties
            echo "SIGNED=true" >> "$GITHUB_ENV"
            echo "已配置正式签名，将额外产出 release 包"
          else
            echo "未配置签名密钥，只产出 debug 包（可直接安装，不能上架）"
          fi

      - name: 编译 Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 编译 Release APK（正式签名）
        if: env.SIGNED == 'true'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: gomoku-dojo-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: 发布到 Release（便于稳定链接下载）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 五子棋道场 · 最新构建
          body: |
            由 GitHub Actions 自动构建。
            - `app-debug.apk`：调试签名，可直接安装
            - `app-release.apk`：正式签名（仅当配置了签名密钥时产出）
          prerelease: true
          files: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
